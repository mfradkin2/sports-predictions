name: Refresh Sports Predictions

on:
  schedule:
    # Hourly, off the top of the hour: GitHub sheds scheduled runs queued at
    # :00 when its runners are busy, and this repo lost most of a night's
    # refreshes that way.
    - cron: '17 * * * *'
    # Four slots an hour: GitHub still skips some scheduled runs, and a
    # refresh every quarter hour means a skipped one costs fifteen minutes,
    # not sixty. A run takes about five minutes; they never overlap (see
    # concurrency below). The page grades finished games itself between
    # runs, so this cadence only sets how soon a result is written down.
    - cron: '32 * * * *'
    - cron: '47 * * * *'
    - cron: '2 * * * *'
  # GitHub sheds far more scheduled runs than the four slots above absorb:
  # gaps of two to four hours were routine. A push is never shed, so an
  # hourly routine outside GitHub pushes one empty commit to this throwaway
  # branch, and that push starts a refresh. The run itself still checks out
  # and publishes main (SP_BRANCH below); the branch is only a doorbell.
  push:
    branches: [refresh-tick]
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of past schedule to re-fetch (raise for a one-off backfill)'
        required: false
        default: ''
      skip_props:
        description: 'Skip the player-statistics fetch'
        type: boolean
        required: false
        default: false
      leagues:
        description: 'Only these leagues, space-separated (e.g. "nfl"); blank for all'
        required: false
        default: ''
      replay:
        description: 'Replay picks: league start end (e.g. "nfl 2026-09-10 2026-09-15")'
        required: false
        default: ''
      skip_verify:
        description: 'Publish even if the build fails its own checks (escape hatch)'
        type: boolean
        required: false
        default: false

# Never let two refreshes race each other onto the same branch.
concurrency:
  group: refresh-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Always build and publish main, whichever ref started the run.
      SP_BRANCH: main
      # One place for the build's flags: the publish step re-runs the build
      # when the code moves under it, and must run it the same way.
      SP_PIPELINE_ARGS: >-
        ${{ github.event.inputs.skip_props == 'true' && '--no-props' || '' }}
        ${{ github.event.inputs.skip_verify == 'true' && '--no-verify' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The whole build is standard-library Python: no packages to install.
      - name: Run tests
        run: python3 -m unittest discover -s tests

      # Ingest from ESPN, learn, predict, price props, render. A league whose
      # feed is down keeps its previous data; the site is rebuilt regardless.
      # The build reads its own output back at the end and exits non-zero if
      # it does not hold together, so nothing broken reaches the publish step.
      - name: Ingest, train, project props and rebuild the site
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          SP_LEAGUES: ${{ github.event.inputs.leagues }}
          SP_REPLAY: ${{ github.event.inputs.replay }}
          # Sportsbook lines for player props (https://the-odds-api.com). Add
          # the key as a repository secret; without it lines are model-derived.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 run_pipeline.py $SP_PIPELINE_ARGS

      # Publish, rebuilding first if a code change landed on main while this
      # refresh was running — otherwise the pages this run made from the older
      # code would overwrite the newer ones. See .github/scripts/publish.sh.
      - name: Publish
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          SP_LEAGUES: ${{ github.event.inputs.leagues }}
          SP_REPLAY: ${{ github.event.inputs.replay }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: bash .github/scripts/publish.sh
