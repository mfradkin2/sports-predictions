name: Refresh Sports Predictions

on:
  schedule:
    # Hourly, off the top of the hour: GitHub sheds scheduled runs queued at
    # :00 when its runners are busy, and this repo lost most of a night's
    # refreshes that way.
    - cron: '17 * * * *'
    # A second slot each hour: GitHub still skips some scheduled runs, and a
    # refresh every half hour means a skipped one costs thirty minutes, not
    # sixty. Runs never overlap (see concurrency below).
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of past schedule to re-fetch (raise for a one-off backfill)'
        required: false
        default: ''
      skip_props:
        description: 'Skip the player-statistics fetch'
        type: boolean
        required: false
        default: false
      leagues:
        description: 'Only these leagues, space-separated (e.g. "nfl"); blank for all'
        required: false
        default: ''
      replay:
        description: 'Replay picks: league start end (e.g. "nfl 2026-09-10 2026-09-15")'
        required: false
        default: ''

# Never let two refreshes race each other onto the same branch.
concurrency:
  group: refresh-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The whole build is standard-library Python: no packages to install.
      - name: Run tests
        run: python3 -m unittest discover -s tests

      # Ingest from ESPN, learn, predict, price props, render. A league whose
      # feed is down keeps its previous data; the site is rebuilt regardless.
      - name: Ingest, train, project props and rebuild the site
        env:
          SP_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          SP_LEAGUES: ${{ github.event.inputs.leagues }}
          SP_REPLAY: ${{ github.event.inputs.replay }}
          # Sportsbook lines for player props (https://the-odds-api.com). Add
          # the key as a repository secret; without it lines are model-derived.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 run_pipeline.py ${{ github.event.inputs.skip_props == 'true' && '--no-props' || '' }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            index.html mlb.html nhl.html nba.html nfl.html \
            assets data history model_state \
            mlb_2026_schedule_enriched.csv \
            nhl_2026_schedule_enriched.csv \
            nba_2026_schedule_enriched.csv \
            nfl_2026_schedule_enriched.csv
          if git diff --cached --quiet; then
            echo "Nothing changed this run."
            exit 0
          fi
          git commit -m "Auto-refresh: predictions and player props $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The hourly schedule can collide with a push; rebase and retry.
          for attempt in 1 2 3 4; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "Could not push after 4 attempts." >&2
          exit 1
